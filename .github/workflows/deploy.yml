name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec
        env:
          # hyper-spec's component specs (spec/components) pick their Chrome
          # driver off this var; "github" selects the flags GitHub Actions
          # runners need (--no-sandbox, --disable-dev-shm-usage).
          DRIVER: github

  deploy:
    name: Deploy to Fly.io
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
